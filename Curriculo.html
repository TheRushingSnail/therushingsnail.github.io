            </ul>
        </nav>
    </header>

    <main>
        <h2>Formulario de Datos Generales</h2>
        
        <form action="#" method="post" class="formulario-datos">
            <div class="campo-formulario">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="campo-formulario">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>
            
            <div class="campo-formulario">
                <label for="cedula">Cédula:</label>
                <input type="text" id="cedula" name="cedula" required>
            </div>
            
            <div class="campo-formulario">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">
            </div>
            
            <div class="campo-formulario">
                <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
            </div>
            
            <fieldset class="campo-formulario">
                <legend>Sexo:</legend>
                <div class="opcion-radio">
                    <input type="radio" id="sexo_masculino" name="sexo" value="masculino">
                    <label for="sexo_masculino">Masculino</label>
                </div>
                <div class="opcion-radio">
                    <input type="radio" id="sexo_femenino" name="sexo" value="femenino">
                    <label for="sexo_femenino">Femenino</label>
                </div>
                <div class="opcion-radio">
                    <input type="radio" id="sexo_otro" name="sexo" value="otro">
                    <label for="sexo_otro">Otro</label>
                </div>
            </fieldset>
            
            <div class="campo-formulario">
                <label for="direccion">Dirección:</label>
                <textarea id="direccion" name="direccion" rows="4"></textarea>
            </div>
            
            <div class="campo-formulario">
                <label for="corregimiento">Corregimiento:</label>
                <input type="text" id="corregimiento" name="corregimiento">
            </div>
            
            <div class="campo-formulario">
                <label for="provincia">Provincia:</label>
                <input type="text" id="provincia" name="provincia">
            </div>
            
            <div class="campo-formulario">
                <label for="pais">País:</label>
                <input type="text" id="pais" name="pais">
            </div>
            
            <div class="campo-formulario">
                <button type="submit">Enviar Datos</button>
            </div>
        </form>
    </main>
